name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify artifacts
        run: |
          ls -lh dist/q-proxy.js dist/_worker.js
          test -f dist/q-proxy.js
          test -f dist/_worker.js
          # ensure no placeholder leaked
          ! grep -q "REPLACE_WITH_YOUR_KV_ID" dist/q-proxy.js
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/q-proxy.js
            dist/_worker.js
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
