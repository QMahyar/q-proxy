function refreshThemeIcon(th){const b=document.getElementById('theme-toggle');if(!b)return;const lab=th==='light'?t('common.theme_dark'):t('common.theme_light');b.setAttribute('aria-label',lab||t('common.theme_toggle'));const u=b.querySelector('use');if(u)u.setAttribute('href',th==='light'?'#i-moon':'#i-sun');const lbl=document.getElementById('theme-toggle-label');if(lbl)lbl.textContent=lab||t('common.theme_toggle')}
applyTheme(getTheme());
try{const mq=window.matchMedia('(prefers-color-scheme: light)');if(mq&&mq.addEventListener)mq.addEventListener('change',e=>{try{if(!localStorage.getItem(THEME_KEY))applyTheme(e.matches?'light':'dark')}catch(err){}})}catch(e){}
const $=id=>document.getElementById(id);
function setLang(l){document.cookie='qp_lang='+l+'; Path=/; Max-Age=31536000; SameSite=Lax';location.reload()}
function toggleTheme(){const cur=getTheme();const nxt=cur==='dark'?'light':'dark';try{localStorage.setItem(THEME_KEY,nxt)}catch(e){}applyTheme(nxt)}
document.getElementById('theme-toggle')?.addEventListener('click',toggleTheme);
function renderLangSeg(){const seg=$('langseg');seg.innerHTML='';[['en','lang.en'],['fa','lang.fa']].forEach(([code,key])=>{const b=document.createElement('button');b.type='button';b.className='seg-btn';b.textContent=t(key);b.setAttribute('aria-pressed',String(LANG===code));b.addEventListener('click',()=>{if(code!==LANG)setLang(code)});seg.appendChild(b)})}
function applyLang(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==='fa'?'rtl':'ltr';$('tagline').textContent=t('app.tagline');document.title='Q Proxy'}
function toast(msg,kind){const box=$('toasts');const el=document.createElement('div');el.className='toast'+(kind==='err'?' toast--err':'');if(kind==='err')el.setAttribute('role','alert');
el.innerHTML='<svg class="ticon" aria-hidden="true"><use href="#i-check"/></svg><span class="toast__msg"></span><button type="button" class="toast__close" aria-label="'+t('common.close')+'"><svg aria-hidden="true"><use href="#i-x"/></svg></button><i class="toast-bar"></i>';
if(kind==='err')el.querySelector('.ticon use').setAttribute('href','#i-x');
el.querySelector('.toast__msg').textContent=msg;
box.appendChild(el);while(box.children.length>3)box.firstChild.remove();
const total=kind==='err'?6000:3500;const bar=el.querySelector('.toast-bar');bar.style.animationDuration=total+'ms';
let gone=false,timer=0;const dismiss=()=>{if(gone)return;gone=true;clearTimeout(timer);el.classList.add('toast--out');setTimeout(()=>el.remove(),220)};
timer=setTimeout(dismiss,total);el.querySelector('.toast__close').addEventListener('click',dismiss)}
if(!document.getElementById('i-x')){const s=document.querySelector('#i-eye').closest('svg');const x=document.createElementNS('http://www.w3.org/2000/svg','symbol');x.id='i-x';x.setAttribute('viewBox','0 0 24 24');x.innerHTML='<path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';s.appendChild(x)}
async function post(path,body){let r;try{r=await fetch(BASE+'api/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Q-Panel':'1'},body:JSON.stringify(body)})}catch(e){throw{status:0,code:'',message:'network'}}
let d=null;try{d=await r.json()}catch(e){}
if(!r.ok||!d||d.ok!==true)throw{status:r.status,code:d&&d.error?d.error.code:'',message:d&&d.error?d.error.message:'',retryAfter:Number(r.headers.get('Retry-After'))||0};
return d.data}
function eyeBtn(targetId){return '<button type="button" class="icon-btn" data-reveal="'+targetId+'" aria-label="'+t('common.reveal')+'" aria-pressed="false"><svg aria-hidden="true"><use href="#i-eye"/></svg></button>'}
function wireReveals(root){root.querySelectorAll('[data-reveal]').forEach(b=>{b.addEventListener('click',()=>{const inp=$(b.getAttribute('data-reveal'));const show=inp.type==='password';inp.type=show?'text':'password';b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',t(show?'common.hide':'common.reveal'));b.querySelector('use').setAttribute('href',show?'#i-eye-off':'#i-eye')})})}
let busy=false,countdownTimer=null;
function setBusy(btn,labelKey){busy=true;btn.disabled=true;btn.innerHTML='<span class="spin" aria-hidden="true"></span>'+t(labelKey)}
function setIdle(btn,labelKey){busy=false;btn.disabled=false;btn.textContent=t(labelKey)}
function showError(id,msg){if(!msg)return;const el=$(id);el.textContent=msg;el.classList.add('show')}
function clearErrors(){document.querySelectorAll('.err').forEach(e=>e.classList.remove('show'))}
function goPanel(){$('card').innerHTML='<p style="text-align:center;color:var(--text-dim)">'+t('login.redirecting')+'</p>';location.replace(BASE+'panel')}
function renderLogin(){clearErrors();const c=$('card');c.innerHTML='<h2 style="font-size:var(--fs-xl);font-weight:600;text-align:center">'+t('login.title')+'</h2><form id="f" novalidate style="margin-top:var(--s-4)"><div class="field"><label class="field__label" for="pw">'+t('login.password')+'</label><div class="control"><input class="input" type="password" id="pw" autocomplete="current-password" spellcheck="false">'+eyeBtn('pw')+'</div><p class="err" id="e-pw" role="alert"></p></div><button class="btn btn--primary btn--block" id="go" type="submit">'+t('login.submit')+'</button></form>';wireReveals(c);const f=$('f'),pw=$('pw'),go=$('go');f.addEventListener('submit',ev=>{ev.preventDefault();if(busy)return;if(!pw.value)return pw.focus();setBusy(go,'login.submitting');post('auth/login',{password:pw.value}).then(()=>goPanel()).catch(err=>{setIdle(go,'login.submit');if(err.status===429){startCountdown(Number(err.retryAfter)||60,go);return}c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');showError('e-pw',err.code==='SETUP_REQUIRED'?'':t('login.error.wrong'));pw.focus();pw.select();if(err.code==='SETUP_REQUIRED'){renderSetup();return}if(err.status===0)toast(t('toast.networkError'),'err')})});pw.focus()}
let countdown=0;
function startCountdown(sec,btn){countdown=sec;clearInterval(countdownTimer);btn.disabled=true;btn.textContent=t('login.error.locked',{seconds:String(countdown)});countdownTimer=setInterval(()=>{countdown--;if(countdown<=0){clearInterval(countdownTimer);btn.disabled=false;btn.textContent=t('login.submit')}else btn.textContent=t('login.error.locked',{seconds:String(countdown)})},1000)}
function strength(pw){let sc=0;if(pw.length>=8)sc++;if(/[A-Z]/.test(pw))sc++;if(/\d/.test(pw))sc++;if(sc<2||pw.length<8)return{k:'setup.strength.weak',v:.33,c:'var(--danger)'};if(sc===2)return{k:'setup.strength.ok',v:.66,c:'var(--warning)'};return{k:'setup.strength.strong',v:1,c:'var(--success)'}}
function renderSetup(){clearErrors();const c=$('card');c.innerHTML='<h2 style="font-size:var(--fs-xl);font-weight:600;text-align:center">'+t('setup.title')+'</h2><p style="text-align:center;color:var(--text-dim);font-size:var(--fs-sm);margin-top:6px">'+t('setup.hint')+'</p><form id="f" novalidate style="margin-top:var(--s-4)"><div class="field"><label class="field__label" for="np">'+t('setup.new')+'</label><div class="control"><input class="input" type="password" id="np" autocomplete="new-password" spellcheck="false">'+eyeBtn('np')+'</div><div class="hint-line" id="meter-row"><span class="meter"><i id="meter-i"></i></span><span id="meter-l"></span></div><p class="hint-line show" id="rule-row"><span>'+t('setup.rule')+'</span></p><p class="err" id="e-np" role="alert"></p></div><div class="field"><label class="field__label" for="cp">'+t('setup.confirm')+'</label><div class="control"><input class="input" type="password" id="cp" autocomplete="new-password" spellcheck="false">'+eyeBtn('cp')+'</div><p class="err" id="e-cp" role="alert"></p></div><button class="btn btn--primary btn--block" id="go" type="submit">'+t('setup.submit')+'</button></form>';wireReveals(c);const f=$('f'),np=$('np'),cp=$('cp'),go=$('go'),row=$('meter-row'),bar=$('meter-i'),lab=$('meter-l');np.addEventListener('input',()=>{row.classList.add('show');const s=strength(np.value);bar.style.width=Math.round(s.v*100)+'%';bar.style.background=s.c;lab.textContent=t(s.k);lab.style.color=s.c});f.addEventListener('submit',ev=>{ev.preventDefault();if(busy)return;clearErrors();if(np.value.length<8){showError('e-np',t('setup.rule'));np.focus();return}if(!(/[A-Z]/.test(np.value)&&/\d/.test(np.value))){showError('e-np',t('setup.rule'));np.focus();return}if(np.value!==cp.value){showError('e-cp',t('setup.error.mismatch'));cp.focus();return}setBusy(go,'setup.submitting');post('auth/setup',{newPassword:np.value}).then(()=>{toast(t('setup.title')+' ✓','ok');goPanel()}).catch(async err=>{if(err.code!=='ALREADY_SET'&&err.status!==409&&err.status!==0){try{await post('auth/login',{password:np.value});return goPanel()}catch(e2){}}setIdle(go,'setup.submit');if(err.status===409||err.code==='ALREADY_SET'){renderLogin();return}showError('e-np',err.status===0?t('toast.networkError'):t('setup.rule'));np.focus()})});np.focus()}
applyLang();renderLangSeg();
(async()=>{try{const d=await fetch(BASE+'api/settings',{credentials:'same-origin'});let j=null;try{j=await d.json()}catch(e){}
if(d.ok&&j&&j.ok&&j.data){goPanel();return}}catch(e){}
renderLogin()})();
})();
</script>
</body>
</html>
