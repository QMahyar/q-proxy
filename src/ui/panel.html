const getLangCookie=()=>{const m=document.cookie.match(/(?:^|;\s*)qp_lang=(en|fa)/);return m&&m[1]||'fa'};

const BASE=location.pathname.replace(/panel\/?$/,'');
const TOAST_MS=3500,TOAST_ERR_MS=6000,PROBE_TIMEOUT=5000,PROBE_TRIES=3,MAX_TARGETS=100;

function toast(msg,kind){const box=$('toasts');const el=document.createElement('div');el.className='toast'+(kind==='err'?' toast--err':kind==='ok'?' toast--ok':'');if(kind==='err')el.setAttribute('role','alert');el.textContent=msg;box.appendChild(el);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>el.remove(),kind==='err'?TOAST_ERR_MS:TOAST_MS)}
async function api(p,o={}){let r;try{const h=o.body!==undefined?{'Content-Type':'application/json','X-Q-Panel':'1'}:(o.mutate?{'X-Q-Panel':'1'}:{});r=await fetch(BASE+p,{credentials:'same-origin',method:o.method||'GET',headers:Object.assign(h,o.headers||{}),body:o.body!==undefined?JSON.stringify(o.body):undefined,signal:o.signal})}catch(e){if(e&&e.name==='AbortError')throw e;throw{status:0,code:'',message:''}}
if(r.status===401){location.replace(BASE+'login');throw{status:401,code:'',message:''}}
let j=null;try{j=await r.json()}catch(e){}

const RE_DOMAIN=/^(?:\*\.)?(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/i;
const RE_IPV4=/^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/;
const RE_HOST=/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$/i;
const RE_V6PREFIX=/^[\da-f:]{2,45}$/i;
function validIpOrHost(line){
const s=line.replace(/^\[|\]$/g,'');
if(RE_IPV4.test(s))return true;
if(RE_V6PREFIX.test(s)&&s.includes(':'))return true;
return RE_HOST.test(s)&&s.includes('.')||(RE_HOST.test(s)&&!s.includes('.'))}
function validateLine(kind,line){
if(!line)return false;
switch(kind){
case 'domain':return RE_DOMAIN.test(line);
case 'url':return /^https:\/\/\S+$/.test(line);
case 'ipv6_prefix':return RE_V6PREFIX.test(line)&&line.includes(':');
case 'ip_or_host':return validIpOrHost(line);
default:return true}}

+'<div class="field"><label class="field__label" for="ck-targets">'+esc(t('checker.targets.label'))+'</label><div class="line-editor"><textarea id="ck-targets" rows="6" class="input textarea textarea--mono" dir="ltr" spellcheck="false" placeholder="1.2.3.4:443"></textarea><div class="meta"><span class="cnt"></span><span class="bad"></span></div></div><p class="field__hint">'+esc(t('checker.targets.hint'))+'</p></div>'
+'<div class="btn-row"><button type="button" class="btn btn--primary" id="ck-run" data-action="run-test"><svg aria-hidden="true"><use href="#i-play"/></svg>'+esc(t('checker.run'))+'</button><button type="button" class="btn btn--ghost" id="ck-stop" data-action="stop-test" disabled><svg aria-hidden="true"><use href="#i-stop"/></svg>'+esc(t('checker.stop'))+'</button></div>';
body.appendChild(card);
const prog=document.createElement('section');prog.className='card';prog.hidden=true;prog.id='ck-progress-card';
prog.innerHTML='<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="ck-fill"></i></div><p class="field__hint" id="ck-count"></p>';
body.appendChild(prog);
const res=document.createElement('section');res.className='card';
res.innerHTML='<div class="card__head"><div class="card__title">'+esc(t('checker.results'))+'</div></div><table class="tbl"><thead><tr><th>'+esc(t('checker.col.target'))+'</th><th>'+esc(t('checker.col.latency'))+'</th><th>'+esc(t('checker.col.rate'))+'</th><th>'+esc(t('checker.col.status'))+'</th></tr></thead><tbody id="ck-rows"></tbody></table>';
body.appendChild(res);
addEmptyRow();
validateOneEditor($('ck-targets'))}
function addEmptyRow(){
$('ck-rows').innerHTML='<tr><td colspan="4"><span class="field__hint">'+esc(t('checker.empty'))+'</span></td></tr>'}
function parseTargets(){
const ta=$('ck-targets');
if(!ta)return[];
const raw=ta.value.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
const seen=new Set(),ok=[],bad=[];
raw.forEach(l=>{
if(!validateLine('',l)||(!RE_IPV4.test(l)&&!validIpOrHost(stripPort(l)))){bad.push(l);return}
const key=l.toLowerCase();
if(seen.has(key))return;
seen.add(key);ok.push(l)});
return{ok,bad,total:raw.length}}
function stripPort(s){
const m=s.match(/^(.+):(\d+)$/);
return m?m[1]:s}
function normalizeTarget(t){
let host=t,port='443';
const m=t.match(/^(.+):(\d+)$/);
if(m){host=m[1];port=m[2]}
return 'https://'+host+':'+port+'/cdn-cgi/trace'}
async function runTest(){
if(CK.running)return;
const{ok,bad}=parseTargets();
validateOneEditor($('ck-targets'));
if(bad.length)toast(t('err.invalid_line',{line:bad[0]}),'err');
if(!ok.length)return;
if(ok.length>MAX_TARGETS){toast(t('checker.tooMany'),'err');return}
CK.running=true;CK.stop=false;
$('ck-run').disabled=true;
$('ck-stop').disabled=false;
const prog=$('ck-progress-card');
prog.hidden=false;
const rows=$('ck-rows');
rows.innerHTML='';
let done=0,healthy=0;
for(const target of ok){
if(CK.stop)break;
const r=await probeTarget(target);
done++;
if(r.ok)healthy++;
appendResultRow(target,r);
updateProgress(done,ok.length);
$('ck-live').textContent=done+' / '+ok.length}
finishTest(done,ok.length,healthy)}
function updateProgress(done,total){
const pct=Math.round(done/total*100);
const fill=$('ck-fill'),bar=fill.closest('.progress'),cnt=$('ck-count');
fill.style.width=pct+'%';
bar.setAttribute('aria-valuenow',String(pct));
cnt.textContent=done+' / '+total}
function finishTest(done,total,healthy){
CK.running=false;CK.stop=false;CK.ctl=null;
$('ck-run').disabled=false;
$('ck-stop').disabled=true;
if(done>0)toast(t('checker.summary',{ok:healthy,total:done}),'ok')}
async function probeTarget(target){
let ok=0,sum=0,made=0;
for(let i=0;i<PROBE_TRIES;i++){
if(CK.stop)break;
made++;
const ctl=new AbortController();
CK.ctl=ctl;
const timer=setTimeout(()=>ctl.abort(),PROBE_TIMEOUT);
const t0=performance.now();
try{
await fetch(normalizeTarget(target),{mode:'no-cors',cache:'no-store',credentials:'omit',signal:ctl.signal});
sum+=performance.now()-t0;ok++}
catch(e){}
finally{clearTimeout(timer)}}
return{ok:ok>0,avg:ok?Math.round(sum/ok):null,rate:made?Math.round(ok/made*100):0}}

function appendResultRow(target,r){
const rows=$('ck-rows');
if(rows.querySelector('[data-empty]'))rows.innerHTML='';
const tr=document.createElement('tr');
const glyph=r.ok&&r.rate===100?'<span class="glyph-ok">✓</span>':r.ok?'<span class="glyph-warn">⚠</span>':'<span class="glyph-bad">✗</span>';
tr.innerHTML='<td data-l="'+esc(t('checker.col.target'))+'"><code dir="ltr" class="mono">'+esc(target)+'</code></td>'
+'<td data-l="'+esc(t('checker.col.latency'))+'">'+(r.avg!=null?r.avg+' ms':'—')+'</td>'
+'<td data-l="'+esc(t('checker.col.rate'))+'">'+r.rate+' %</td>'
+'<td data-l="'+esc(t('checker.col.status'))+'">'+glyph+' '+esc(r.ok?(r.rate===100?t('checker.status.ok'):t('checker.status.partial')):t('checker.status.failed'))+'</td>';
rows.appendChild(tr)}
function stopTest(){
CK.stop=true;
CK.running=false;
$('ck-run').disabled=false;
$('ck-stop').disabled=true;
if(CK.ctl)CK.ctl.abort()}
function genFor(kind){
if(kind==='uuid')return crypto.randomUUID();
if(kind==='hex12')return randomHex(12);
return randomPass()}
const ACTIONS={
copy(el){
const valEl=el.dataset.copyId?$(el.dataset.copyId):null;
const val=el.dataset.copyValue||(valEl?valEl.textContent:'');
copyText(val||'').then(()=>{
el.classList.add('copied');
const use=el.querySelector('use');
if(use){use.setAttribute('href','#i-check');setTimeout(()=>{use.setAttribute('href','#i-copy');el.classList.remove('copied')},900)}
toast(t('common.copied'),'ok')})},
reveal(el){
const inp=$(el.dataset.target);
if(!inp)return;
const show=inp.type==='password';
inp.type=show?'text':'password';
el.setAttribute('aria-pressed',String(show));
el.setAttribute('aria-label',t(show?'common.hide':'common.reveal'));
const use=el.querySelector('use');
if(use)use.setAttribute('href',show?'#i-eye-off':'#i-eye')},
generate(el){
const inp=$(el.dataset.target);
if(!inp)return;
inp.value=genFor(el.dataset.gen);
inp.dispatchEvent(new Event('change',{bubbles:true}));
toast(t('common.generated'),'ok')},
qr(el){openQr(el.dataset.qr)},
'close-modal'(){closeModal('m-qr')},
logout(){
confirmDialog('confirm.logout_title','confirm.logout_body',true).then(async yes=>{
if(!yes)return;
try{await api('api/auth/logout',{method:'POST',mutate:true})}catch(err){}
location.replace(BASE+'login')})},
apply(){
(async()=>{for(const sec of[...S.dirty])await applySection(sec)})()},
discard(){
[...S.dirty].forEach(sec=>discardSection(sec))},
'reset-defaults'(){
confirmDialog('confirm.reset_title','confirm.reset_body',true).then(async yes=>{
if(!yes)return;
try{await api('api/settings/reset',{method:'POST',body:{}});location.reload()}catch(err){toastErr(err)}})},
'refresh-ip'(){loadMyIp()},
'run-test'(){runTest()},
'stop-test'(){stopTest()}};
function onDocClick(e){
const el=e.target.closest('[data-action]');
if(el){
const fn=ACTIONS[el.dataset.action];
if(fn)fn(el);
return}
const chip=e.target.closest('[data-chip]');
if(chip){handleChip(chip);return}
const mode=e.target.closest('[data-mode]');
if(mode){
S.subMode=mode.dataset.mode;
mode.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',String(b===mode)));
const urls=[...S.subs].sort((a,b)=>(a.format==='base64'?-1:0)-(b.format==='base64'?-1:0));
document.querySelectorAll('#home-body [id^="sub-u"] code').forEach((code,i)=>{
const entry=urls[i];
if(!entry) return;
const newUrl=subUrlWithMode(entry.url);
code.textContent=newUrl;
const wrapper=code.closest('.copy-field');
if(wrapper){
const qrBtn=wrapper.querySelector('[data-qr]');
if(qrBtn) qrBtn.setAttribute('data-qr',newUrl);
}
});
return}}
function handleChip(chip){
const group=chip.closest('[data-type="chips"]');
if(!group)return;
group.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-checked','false'));
chip.setAttribute('aria-checked','true');
markDirty();
clearTimeout(leTimer);
if(group.hasAttribute('data-fpreset')){
const preset=chip.dataset.preset;
const panel=group.closest('#sp-fragment');
if(panel){
['lengthMin','lengthMax','delayMin','delayMax'].forEach((k,idx)=>{
const el=panel.querySelector('[data-bind="fragment.'+k+'"]');
if(!el)return;
if(PRESETS[preset]){el.value=String(PRESETS[preset][idx]);el.disabled=true}
else el.disabled=false});
panel.querySelectorAll('[data-bind^="fragment."]').forEach(el=>{
if(el.tagName==='SELECT')el.disabled=preset==='off'})}}
refreshShowIf();
validateAllLineEditors()}
function onChange(e){
if(e.target.closest('[data-kill]')){setKillSwitch(e.target.checked);return}
if(e.target.closest('[data-lang-sel]')){setLangCookie(e.target.value);location.reload();return}
if(e.target.closest('[data-port-master]')){
const master=e.target;
master.closest('fieldset').querySelectorAll('[data-port-opt]').forEach(c=>{c.checked=master.checked});
markDirty();
updatePortMasters();
return}
const bind=e.target.closest('[data-bind]');
if(bind){
if(bind.tagName==='TEXTAREA')validateOneEditor(bind);
markDirty();
updatePortMasters();
if(/^vlessEnabled$|^vmessEnabled$|^trojanEnabled$|^ssEnabled$/.test(bind.dataset.bind))applyProtoDim()}}
function onInput(e){
const bind=e.target.closest('[data-bind]');
if(!bind)return;
if(bind.tagName==='TEXTAREA'){clearTimeout(leTimer);leTimer=setTimeout(()=>validateOneEditor(bind),250)}
markDirty()}
function wireEvents(){
document.addEventListener('click',onDocClick);
document.addEventListener('change',onChange);
document.addEventListener('input',onInput);
$('m-confirm').addEventListener('click',e=>{if(e.target===$('m-confirm'))settleConfirm(false)});
$('m-qr').addEventListener('click',e=>{if(e.target===$('m-qr'))closeModal('m-qr')});
$('cf-cancel').addEventListener('click',()=>settleConfirm(false));
$('cf-ok').addEventListener('click',()=>settleConfirm(true));
$('m-qr').addEventListener('keydown',e=>{if(e.key==='Tab')trapFocus($('m-qr'),e)});
$('m-confirm').addEventListener('keydown',e=>{if(e.key==='Tab')trapFocus($('m-confirm'),e)});
document.addEventListener('keydown',e=>{
if(e.key==='Escape'){
if(!$('m-confirm').hidden)settleConfirm(false);
else if(!$('m-qr').hidden)closeModal('m-qr')}});
window.addEventListener('hashchange',navigate);
window.addEventListener('beforeunload',e=>{
if(S.dirty.size){e.preventDefault();e.returnValue=''}});
wireTabKeys($('nav'),'.tab');
wireTabKeys($('subtabs'),'.subtab')}
function wireTabKeys(bar,sel){
bar.addEventListener('keydown',e=>{
const tabs=[...bar.querySelectorAll(sel)];
const idx=tabs.indexOf(document.activeElement);
if(idx<0)return;
let next=null;
if(e.key==='ArrowRight'||e.key==='ArrowLeft')next=(idx+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
else if(e.key==='Home')next=0;
else if(e.key==='End')next=tabs.length-1;
if(next!=null){e.preventDefault();tabs[next].focus();tabs[next].click()}})}
function openQr(url){
$('qr-caption').innerHTML='<div class="copy-field"><code dir="ltr">'+esc(url)+'</code><button type="button" class="btn btn--icon btn--sm" data-action="copy" data-copy-value="'+esc(url)+'" aria-label="'+esc(t('common.copy'))+'"><svg aria-hidden="true"><use href="#i-copy"/></svg></button></div>';
if(!QR.render($('qr-canvas'),url)){toast(t('toast.tooLong'),'err');return}
openModal('m-qr')}
function currentSection(){
const r=parseRoute();
return r.view==='settings'?r.sec:'general'}
async function boot(){
buildShell();
wireEvents();
try{
const results=await Promise.all([api('api/settings'),api('api/status').catch(()=>null),api('api/suburls').catch(()=>null)]);
S.set=results[0]||{};
S.status=results[1];
S.subs=(results[2]&&results[2].urls)||[]}
catch(e){
if(e&&e.status===401)return;
S.set={};
toastErr(e);
return}
renderSettings();
renderChecker();
renderHome();
navigate()}
boot();
})();
</script>
